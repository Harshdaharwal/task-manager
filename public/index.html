<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Task Manager — Sign In</title>
<meta name="description" content="Sign in to Task Manager — task delegation and checklist platform."/>
<link rel="icon" type="image/svg+xml" href="/task-logo.svg"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@700;800;900&display=swap" rel="stylesheet"/>
<style>
  :root {
    --bg-color: #f6f3fc;
    --card-bg: #ffffff;
    --text-primary: #241a3f;
    --text-secondary: #6f6a7c;
    --accent-purple: #8b5cf6;
    --accent-purple-dark: #6d28d9;
    --input-bg: #f7f4ff;
    --input-border: #ddd6fe;
    --input-focus: #6d28d9;
    --label-color: #4c1d95;
  }

  *{margin:0;padding:0;box-sizing:border-box;}

  body {
    font-family:'Inter',sans-serif;
    background: var(--bg-color);
    background-image: 
      radial-gradient(circle at top left, rgba(139, 92, 246, 0.08) 0%, transparent 40%),
      radial-gradient(circle at bottom right, rgba(124, 58, 237, 0.05) 0%, transparent 50%);
    min-height:100vh;
    display:flex;align-items:center;justify-content:center;
    overflow:hidden;
    position:relative;
  }

  /* Subtle background grid */
  .bg-grid {
    position:fixed;inset:0;z-index:0;pointer-events:none;
    background-image:
      linear-gradient(rgba(109, 40, 217, 0.015) 1px, transparent 1px),
      linear-gradient(90deg, rgba(109, 40, 217, 0.015) 1px, transparent 1px);
    background-size:40px 40px;
  }

  .wrap {
    position:relative;z-index:10;
    width:100%;max-width:360px;padding:16px;
  }

  /* ── CARD ── */
  .card {
    background: var(--card-bg);
    border-radius:24px;
    padding:36px 28px 32px;
    box-shadow:
      0 15px 35px rgba(109, 40, 217, 0.08),
      0 5px 15px rgba(0, 0, 0, 0.04);
    position:relative;overflow:hidden;
    animation:cardIn .65s cubic-bezier(.34,1.56,.64,1) both;
  }

  /* Accent top bar */
  .card-top-bar {
    height:4px;
    background:linear-gradient(90deg, var(--accent-purple) 0%, var(--accent-purple-dark) 100%);
    position:absolute;top:0;left:0;right:0;
  }

  /* ── BRAND LOGO INSIDE CARD ── */
  .brand-logo-section {
    text-align:center;margin-bottom:24px;
  }
  .brand-logo-banner {
    width:96px;height:44px;border-radius:10px;margin:0 auto 10px;
    background:#ffffff;
    display:grid;place-items:center;position:relative;
    box-shadow:
      0 0 0 1px rgba(139, 92, 246, 0.35),
      0 4px 12px rgba(0,0,0,0.1);
    overflow:hidden;
  }
  .brand-logo-banner img {
    width:100%;height:100%;object-fit:contain;
  }
  .logo-sub {
    font-size:10px;font-weight:700;letter-spacing:3px;
    color:var(--accent-purple-dark);text-transform:uppercase;
    margin-bottom:6px;
  }
  
  /* Gold dots matching image layout */
  .logo-dots {
    display:flex;justify-content:center;gap:4px;margin-bottom:8px;
  }
  .logo-dots span {
    width:5px;height:5px;border-radius:50%;
    background:var(--accent-purple);
  }
  .logo-dots span:nth-child(2) { background: var(--accent-purple-dark); }
  .logo-dots span:nth-child(3) { background: #2563eb; }

  /* ── CARD HEADING ── */
  .card-title {
    font-size:20px;font-weight:800;color:var(--text-primary);
    margin-bottom:3px;text-align:center;letter-spacing:-0.3px;
  }
  .card-sub {
    font-size:13px;color:var(--text-secondary);
    margin-bottom:24px;text-align:center;
  }

  /* ── FORM ── */
  .form-group {margin-bottom:18px;}
  
  label {
    display:block;font-size:10px;font-weight:700;letter-spacing:1px;
    text-transform:uppercase;color:var(--label-color);margin-bottom:6px;
  }
  
  .input-wrap {position:relative;}
  
  .input-icon {
    position:absolute;left:16px;top:50%;transform:translateY(-50%);
    font-size:15px;color:#a78bfa;pointer-events:none;
    transition:color .2s;
  }
  
  input {
    width:100%;
    padding:12px 14px 12px 42px;
    background:var(--input-bg);
    border:1.5px solid var(--input-border);
    border-radius:12px;
    font-size:14px;font-family:'Inter',sans-serif;
    color:var(--text-primary);outline:none;
    transition:all .25s ease;
  }
  input::placeholder{color:#a89fc0;}
  input:focus {
    border-color:var(--input-focus);
    background:#ffffff;
    box-shadow:0 0 0 3px rgba(124, 58, 237, 0.12);
  }
  input:focus ~ .input-icon,
  .input-wrap:focus-within .input-icon { color:var(--accent-purple-dark); }

  /* ── ERROR ── */
  .error {
    display:none;background:rgba(220,38,38,0.06);
    border:1px solid rgba(220,38,38,0.2);
    color:#b91c1c;padding:10px 14px;
    border-radius:12px;font-size:13px;margin-bottom:14px;
    animation:shake .35s ease;text-align:center;
  }
  @keyframes shake {
    0%,100%{transform:translateX(0);}
    25%{transform:translateX(-6px);}
    75%{transform:translateX(6px);}
  }

  /* ── BUTTON ── */
  .btn-login {
    width:100%;padding:13px;margin-top:6px;
    background:linear-gradient(135deg, var(--accent-purple) 0%, var(--accent-purple-dark) 100%);
    color:#ffffff;border:none;border-radius:12px;
    font-size:14px;font-weight:700;font-family:'Inter',sans-serif;
    cursor:pointer;position:relative;overflow:hidden;
    transition:all .2s;
    box-shadow:0 6px 18px rgba(124, 58, 237, 0.25);
    letter-spacing:.3px;
  }
  .btn-login:hover {
    transform:translateY(-1.5px);
    background:linear-gradient(135deg, #9d7bfa 0%, var(--accent-purple-dark) 100%);
    box-shadow:0 8px 22px rgba(124, 58, 237, 0.35);
  }
  .btn-login:active{transform:translateY(0);}
  .btn-login:disabled{opacity:.55;cursor:not-allowed;transform:none;}

  /* Loading spinner inside button */
  .btn-login .spinner {
    display:none;width:16px;height:16px;border:2px solid rgba(255,255,255,0.3);
    border-top-color:#fff;border-radius:50%;
    animation:spin .7s linear infinite;
    margin:0 auto;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  .btn-login.loading .btn-text{display:none;}
  .btn-login.loading .spinner{display:block;}

  /* ── FOOTER ── */
  .footer {
    text-align:center;font-size:11px;color:var(--text-secondary);
    margin-top:24px;letter-spacing:.3px;
  }
  .footer strong{color:var(--accent-purple-dark);}

  @keyframes cardIn {
    from{opacity:0;transform:translateY(24px) scale(.97);}
    to{opacity:1;transform:translateY(0) scale(1);}
  }
  @keyframes fadeDown {
    from{opacity:0;transform:translateY(-15px);}
    to{opacity:1;transform:translateY(0);}
  }

  /* ══════════════════════════════════════
     ✨ MOTION — aurora, entrance, tilt, success
  ══════════════════════════════════════ */
  :root {
    --ease-out: cubic-bezier(.22,1,.36,1);
    --ease-spring: cubic-bezier(.34,1.56,.64,1);
  }
  .blob {position:fixed;border-radius:50%;filter:blur(70px);z-index:0;pointer-events:none;}
  .blob.b1 {width:420px;height:420px;background:rgba(167,139,250,.45);top:-140px;left:-120px;}
  .blob.b2 {width:380px;height:380px;background:rgba(129,140,248,.35);bottom:-140px;right:-100px;}
  .blob.b3 {width:260px;height:260px;background:rgba(240,171,252,.3);top:45%;left:62%;}

  .btn-login::after {
    content:'';position:absolute;top:0;left:-60%;width:40%;height:100%;pointer-events:none;
    background:linear-gradient(100deg,transparent,rgba(255,255,255,.45),transparent);
    transform:skewX(-20deg);
  }
  .btn-login .arrow{display:inline-block;transition:transform .25s var(--ease-out);}
  .btn-login:hover .arrow{transform:translateX(4px);}
  .btn-login .btn-done{display:none;}
  .btn-login.success,.btn-login.success:disabled {
    opacity:1;background:linear-gradient(135deg,#22c55e 0%,#16a34a 100%);
    box-shadow:0 8px 22px rgba(22,163,74,.35);
  }
  .btn-login.success .btn-text,.btn-login.success .spinner{display:none;}
  .btn-login.success .btn-done{display:inline-block;}

  @keyframes drift1{to{transform:translate(120px,90px) scale(1.15);}}
  @keyframes drift2{to{transform:translate(-110px,-70px) scale(1.1);}}
  @keyframes drift3{to{transform:translate(-160px,60px) scale(.85);}}
  @keyframes rise{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:none;}}
  @keyframes logoIn{from{opacity:0;transform:scale(.6) rotate(-8deg);}to{opacity:1;transform:none;}}
  @keyframes float{0%,100%{transform:translateY(0);}50%{transform:translateY(-4px);}}
  @keyframes shine{0%{transform:translateX(-120%);}35%,100%{transform:translateX(120%);}}
  @keyframes dotWave{0%,60%,100%{transform:translateY(0);}30%{transform:translateY(-4px);}}
  @keyframes wave{0%,60%,100%{transform:rotate(0);}10%,30%{transform:rotate(14deg);}20%{transform:rotate(-8deg);}40%{transform:rotate(-4deg);}50%{transform:rotate(10deg);}}
  @keyframes barFlow{to{background-position:300% 0;}}
  @keyframes shakeCard{0%,100%{transform:translateX(0);}15%,55%{transform:translateX(-8px);}35%,75%{transform:translateX(8px);}}
  @keyframes leave{to{opacity:0;transform:translateY(-18px) scale(.96);}}
  @keyframes pop{from{opacity:0;transform:scale(.5);}to{opacity:1;transform:none;}}

  @media (prefers-reduced-motion:no-preference) {
    .blob{will-change:transform;}
    .blob.b1{animation:drift1 18s ease-in-out infinite alternate;}
    .blob.b2{animation:drift2 22s ease-in-out infinite alternate;}
    .blob.b3{animation:drift3 26s ease-in-out infinite alternate;}

    /* Card ke andar sab ek-ek karke upar aaye */
    .rise{animation:rise .6s var(--ease-out) calc(.18s + var(--d,0) * .07s) backwards;}

    .brand-logo-banner{animation:logoIn .7s var(--ease-spring) .15s backwards, float 4.5s ease-in-out 1s infinite;}
    .brand-logo-banner::after {
      content:'';position:absolute;inset:0;pointer-events:none;
      background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.8) 50%,transparent 65%);
      transform:translateX(-120%);animation:shine 4s ease-in-out 1.2s infinite;
    }
    .logo-dots span{animation:dotWave 1.8s ease-in-out infinite;}
    .logo-dots span:nth-child(2){animation-delay:.15s;}
    .logo-dots span:nth-child(3){animation-delay:.3s;}
    .wave{display:inline-block;transform-origin:70% 80%;animation:wave 2s ease-in-out .9s 2;}

    .card-top-bar {
      background:linear-gradient(90deg,#8b5cf6,#6d28d9,#2563eb,#8b5cf6);
      background-size:300% 100%;animation:barFlow 6s linear infinite;
    }
    /* Mouse ke saath chalne wali soft spotlight */
    .card::after {
      content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;
      background:radial-gradient(360px circle at var(--mx,50%) var(--my,0%),rgba(139,92,246,.09),transparent 45%);
      opacity:0;transition:opacity .4s;
    }
    .card:hover::after{opacity:1;}
    .wrap{transition:transform .3s var(--ease-out);}
    .wrap.shake{animation:shakeCard .45s ease;}
    .wrap.leaving{animation:leave .35s cubic-bezier(.55,0,.75,.2) forwards;}

    .input-icon{transition:color .2s,transform .35s var(--ease-spring);}
    .input-wrap:focus-within .input-icon{transform:translateY(-50%) scale(1.18);}
    label{transition:color .2s,letter-spacing .3s var(--ease-out);}
    .form-group:focus-within label{color:var(--accent-purple);letter-spacing:1.4px;}

    .btn-login:hover::after{left:130%;transition:left .75s var(--ease-out);}
    .btn-login:active{transform:scale(.98);}
    .btn-login.success .btn-done{animation:pop .45s var(--ease-spring);}
  }
</style>
</head>
<body>

<div class="bg-grid"></div>
<div class="blob b1"></div>
<div class="blob b2"></div>
<div class="blob b3"></div>

<div class="wrap">

  <!-- Card -->
  <div class="card">
    <div class="card-top-bar"></div>

    <!-- Brand Logo Section Inside Card -->
    <div class="brand-logo-section rise" style="--d:0">
      <div class="brand-logo-banner">
        <img src="/task-logo.svg" alt="Task Manager Logo"
             onerror="this.style.display='none';this.nextElementSibling.style.display='block'"/>
        <span class="logo-fallback" style="display:none">✓</span>
      </div>
      <div class="logo-sub">Plan · Track · Deliver</div>
      <div class="logo-dots">
        <span></span>
        <span></span>
        <span></span>
      </div>
    </div>

    <div class="card-title rise" style="--d:1">Welcome back <span class="wave">👋</span></div>
    <div class="card-sub rise" style="--d:2">Sign in to continue to your workspace</div>

    <div class="error" id="err"></div>

    <div class="form-group rise" style="--d:3">
      <label for="email">Email Address</label>
      <div class="input-wrap">
        <span class="input-icon">✉</span>
        <input type="email" id="email" placeholder="you@example.com" autocomplete="email" autocapitalize="none" autocorrect="off" required/>
      </div>
    </div>

    <div class="form-group rise" style="--d:4">
      <label for="password">Password</label>
      <div class="input-wrap">
        <span class="input-icon">🔒</span>
        <input type="password" id="password" placeholder="Enter your password" required onkeydown="if(event.key==='Enter')login()"/>
      </div>
    </div>

    <button class="btn-login rise" style="--d:5" id="loginBtn" onclick="login()">
      <span class="btn-text">Sign In <span class="arrow">&rarr;</span></span>
      <div class="spinner"></div>
      <span class="btn-done">✓ Welcome!</span>
    </button>

    <div class="footer rise" style="--d:6">
      <strong>Task Manager</strong> &nbsp;·&nbsp; Secure Workspace
    </div>
  </div>

</div>

<script>
// Agar already logged in hai toh seedha /app pe bhejo
(async function checkExistingSession() {
  try {
    const r = await fetch('/api/me', { credentials: 'include' });
    if (r.ok) { window.location.replace('/app'); }
  } catch(e) {}
})();

// ── Motion: 3D tilt + spotlight (sirf mouse wale devices pe), shake on error ──
const REDUCED_MOTION = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const wrapEl = document.querySelector('.wrap');
const cardEl = document.querySelector('.card');
if (!REDUCED_MOTION && window.matchMedia('(hover:hover) and (pointer:fine)').matches) {
  let raf = 0;
  cardEl.addEventListener('pointermove', e => {
    cancelAnimationFrame(raf);
    raf = requestAnimationFrame(() => {
      const r = cardEl.getBoundingClientRect();
      const x = (e.clientX - r.left) / r.width, y = (e.clientY - r.top) / r.height;
      cardEl.style.setProperty('--mx', (x * 100) + '%');
      cardEl.style.setProperty('--my', (y * 100) + '%');
      wrapEl.style.transform = `perspective(1000px) rotateX(${(0.5 - y) * 6}deg) rotateY(${(x - 0.5) * 6}deg)`;
    });
  });
  cardEl.addEventListener('pointerleave', () => { cancelAnimationFrame(raf); wrapEl.style.transform = ''; });
}
function shakeCard(){
  if (REDUCED_MOTION) return;
  wrapEl.classList.remove('shake'); void wrapEl.offsetWidth; wrapEl.classList.add('shake');
}

async function login(){
  const email    = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const err      = document.getElementById('err');
  const btn      = document.getElementById('loginBtn');

  err.style.display = 'none';

  if(!email || !password){
    err.textContent = 'Please fill all fields';
    err.style.display = 'block';
    shakeCard();
    return;
  }

  btn.classList.add('loading');
  btn.disabled = true;

  try {
    const r = await fetch('/api/login', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      credentials:'include',
      body: JSON.stringify({email, password})
    });
    const d = await r.json();
    if(!r.ok){
      err.textContent = d.error || 'Login failed';
      err.style.display = 'block';
      shakeCard();
      btn.classList.remove('loading');
      btn.disabled = false;
      return;
    }
    // Token backup for cookie-blocked environments
    if(d.token) localStorage.setItem('authToken', d.token);
    if (REDUCED_MOTION) { window.location.replace('/app'); return; }
    // Success: button green ✓, card upar fade — phir redirect
    btn.classList.remove('loading');
    btn.classList.add('success');
    setTimeout(() => wrapEl.classList.add('leaving'), 200);
    setTimeout(() => window.location.replace('/app'), 520);
  } catch(e) {
    err.textContent = 'Server error. Please try again.';
    err.style.display = 'block';
    shakeCard();
    btn.classList.remove('loading');
    btn.disabled = false;
  }
}
</script>
</body>
</html>
